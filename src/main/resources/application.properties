spring.application.name=digitalfix-ms-audit
# Puerto local: BFF 8080, Catalog 8081, Workorders 8082, Audit 8083
server.port=8083

# Oracle RDS: misma base que Catalog y Workorders. Definir DB_URL, DB_USERNAME y DB_PASSWORD
# como variables de entorno (IntelliJ: Run > Edit Configurations > Environment variables).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT de Entra: mismo emisor y audiencia que Workorders
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/762b016c-dc33-4db0-ad42-44f32afe71f4/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=85329d90-58f8-4317-a820-452599b3b04c

# Kafka (consumidor)
# enabled=false deja la API funcionando pero sin escuchar Kafka (útil en tests)
digitalfix.kafka.enabled=${DIGITALFIX_KAFKA_ENABLED:true}
digitalfix.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
# Grupo propio: recibe TODOS los eventos, independiente del grupo "report"
digitalfix.kafka.group-id=${KAFKA_GROUP_ID:audit}
digitalfix.kafka.topico=workorders.events
# DLT propio de este consumidor (creado por digitalfix-infra/kafka)
digitalfix.kafka.topico-dlt=workorders.events.audit.DLT
# Reintentos ante errores temporales (ej. Oracle caído) antes de mandar al DLT
digitalfix.kafka.reintentos=${KAFKA_REINTENTOS:3}
digitalfix.kafka.espera-reintento=${KAFKA_ESPERA_REINTENTO:1s}

# Cada línea de log muestra el correlationId del evento (lo pone el consumidor en el MDC)
logging.pattern.level=%5p [cid:%X{correlationId:-}]
