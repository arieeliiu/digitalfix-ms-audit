spring.datasource.url=jdbc:h2:mem:audit;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Kafka apagado: los tests llaman al consumidor directamente, sin broker
digitalfix.kafka.enabled=false
digitalfix.kafka.bootstrap-servers=localhost:9092
digitalfix.kafka.group-id=audit
digitalfix.kafka.topico=workorders.events
digitalfix.kafka.topico-dlt=workorders.events.audit.DLT
digitalfix.kafka.reintentos=3
digitalfix.kafka.espera-reintento=10ms
